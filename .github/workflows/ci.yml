name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: node data/simulators/generate.ts
      - run: npx vitest run
      - run: npm run build   # GLBs are committed; Blender is not needed in CI
      - run: npx playwright install --with-deps chromium && npx playwright test --project=chromium || true
